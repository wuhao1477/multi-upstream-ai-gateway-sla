name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建的版本 Tag
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 构建发布二进制
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          make web
          mkdir -p dist
          for arch in amd64 arm64; do
            bundle="sla-core_${VERSION}_linux_${arch}"
            mkdir -p "dist/${bundle}"
            for name in sla-core collector migrate; do
              CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build \
                -ldflags "-X main.version=${VERSION} -s -w" \
                -o "dist/${bundle}/${name}" "./cmd/${name}"
            done
            tar -C dist -czf "dist/${bundle}.tar.gz" "${bundle}"
            rm -rf "dist/${bundle}"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wuhao1477/multi-upstream-ai-gateway-sla
          tags: |
            type=raw,value=${{ inputs.tag || github.ref_name }}

      - name: 推送多架构 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ inputs.tag || github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --clobber dist/*.tar.gz dist/SHA256SUMS
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --generate-notes \
              dist/*.tar.gz dist/SHA256SUMS
          fi
