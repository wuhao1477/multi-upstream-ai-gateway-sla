name: gate

# 交付门禁：文档一致性 12 类检查 + DDL 在 postgres:16 真跑。
#
# 与本地**同一份脚本**（verify/gate.sh）——这是 00 §5 与 README 声称的
# "CI 与本地共用一份门禁"的落地。此前该说法只是计划：gate.sh 已存在，
# 但没有任何 workflow 去跑它，于是"DDL 真跑"只在有 Docker 的开发机上偶发进行。
#
# 现阶段仓库仍是纯文档（无 go.mod），故只跑文档与 DDL 两道。
# M0 起 Go 骨架落地后，在下方 build 作业里补 go build / test / lint
# 与 FR-112 不可存列断言、凭证脱敏断言（[10 §3](docs/dev/10-project-structure.md)）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest 自带 python3 与 docker，无需额外安装：
      # check_docs.py / extract_ddl.py 只用标准库（glob/os/re/sys），
      # ddl-check.sh 用 docker run 起临时 postgres:16。
      #
      # 📌 关于 Node：本项目技术栈是 **Go**，门禁脚本是 shell + python3，
      #    **构建链路完全不经 Node**。唯一的 Node 来源是 `actions/checkout`
      #    这个官方 action —— GitHub 的 JS action 跑在 runner 自带的 Node 上，
      #    与被测项目的技术栈无关（Go 项目用官方 action 同样是标准做法）。
      #    若要彻底无 Node，可把 checkout 换成手写 `git clone`，但那要自行
      #    处理 token、depth、ref 与 PR merge commit，得不偿失。
      #    Node 20 弃用告警是 GitHub 侧的迁移节奏，待其发 v5 再升即可。
      - name: 环境自检
        run: |
          python3 --version
          docker --version

      - name: 门禁（文档一致性 + DDL 真跑）
        run: ./verify/gate.sh

      # ⚠️ 刻意不上传 ddl-extracted.sql 为 artifact（第 45 轮删除）：
      #    该文件**已入库**，且随时可由 `python3 verify/extract_ddl.py` 从
      #    02 重新生成 —— artifact 是第三份副本，纯冗余，还多引一个
      #    JS action（Node 运行时）。失败时直接看仓库文件或本地重跑即可。

      # ddl-extracted.sql 是 02 的派生物并已入库；若与提交内容不一致，
      # 说明有人改了 02 的 sql 块却没重跑抽取 —— 这会让入库的 DDL 与文档脱节。
      - name: 校验 ddl-extracted.sql 与文档同步
        run: |
          if ! git diff --quiet -- verify/ddl-extracted.sql; then
            echo "::error::verify/ddl-extracted.sql 与 docs/dev/02-data-model.md 不一致。"
            echo "请在本地跑 python3 verify/extract_ddl.py 后一并提交。差异："
            git --no-pager diff -- verify/ddl-extracted.sql
            exit 1
          fi
          echo "✅ ddl-extracted.sql 与文档同步"

  # ── Go 构建与测试（#1 骨架落地后启用；[10 §3](docs/dev/10-project-structure.md) 门禁清单）──
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 跟随 go.mod 声明，不锁死 patch（10 开放点 1）
          go-version-file: go.mod
          cache: true

      - name: 格式检查
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: 构建
        run: make build

      - name: 单测
        run: make test

      # 配置键清单是从 09 §4bis 生成的：文档改了没重新生成 → 运行时静默取零值
      # （catalog_missing_rounds=0 会让每轮采集都判模型下架）。故校验生成物同步。
      - name: 配置键清单与文档同步
        run: make gen-check

      # ── 三道硬约束守卫随对应功能接入（[10 §3](docs/dev/10-project-structure.md)）──
      # FR-112 不可存列断言：随 #2 迁移落地（现在无 migrations/ 可扫）
      # sk- 前缀脱敏断言：随 #9 Key 管理端点落地（现在无端点会打印凭证）
      # billing_unit 缩放断言：随 #7 价格采集落地（现在无成本计算代码）
      # ⚠️ 三者都在对应 issue 的完成标准里，勿让 issue 关闭时漏掉本文件的启用。
