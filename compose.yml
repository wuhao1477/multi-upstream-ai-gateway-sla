name: sla-gateway

x-core-env: &core-env
  DATABASE_URL: postgres://sla:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置}@postgres:5432/sla?sslmode=disable
  ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN 必须设置}
  SLA_ADDR: ":8080"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置}
      POSTGRES_DB: sla
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sla -d sla"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  sla-core-a: &core
    image: ${SLA_IMAGE:-ghcr.io/wuhao1477/multi-upstream-ai-gateway-sla-public:v1.0.0}
    environment: *core-env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/sla-core", "-version"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  sla-core-b:
    <<: *core
    ports: []

  collector:
    <<: *core
    ports: []
    entrypoint: ["/collector"]
    healthcheck:
      disable: true

  caddy:
    image: caddy:2
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - sla-core-a
      - sla-core-b
    restart: unless-stopped

volumes:
  pgdata:
  caddydata:
