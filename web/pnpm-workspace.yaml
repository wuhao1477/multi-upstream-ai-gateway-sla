# pnpm 11 起不再读 package.json 里的 `pnpm` 字段，配置一律搬到这里。
#
# 这条 override 是**必需**的，不是冗余：pinia 与 vue-router 把 vue 声明为
# peerDependencies `^3.5.11`，而按 semver，预发布版 3.6.0-rc.6 不落在 `^3.5.11`
# 里（预发布只匹配同一 major.minor.patch 上显式带预发布的范围）。不锁死就会
# 收到 peer 警告，并在依赖树稍有变化时被解析成第二份 vue —— 两个 Vue 实例
# 会让 Pinia 与 router 的注入失效，症状是运行时 inject 拿不到东西，不是编译错。
#
# 与 package.json 的 dependencies.vue **必须同版本**，抬版本时一起抬。
# 只改一处的后果是静默的：解析出第二份 vue，编译期不报错，运行时才失效。
# 改完用 `node -p "require('vue/package.json').version"` 确认装到的是哪个，
# 别只看清单。
overrides:
  vue: 3.6.0-rc.6
